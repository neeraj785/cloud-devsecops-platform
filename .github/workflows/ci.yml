name: CloudShop CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend-test:

    name: Backend Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Test backend health endpoint
        run: |
          cd backend

          python run.py > server.log 2>&1 &

          sleep 5

          curl --fail http://localhost:5000/api/health


  frontend-build:

    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install dependencies
        run: |
          cd frontend
          npm ci


      - name: Build frontend
        run: |
          cd frontend
          npm run build


  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Build backend image
        run: |
          docker build \
            -t cloudshop-backend:${{ github.sha }} \
            ./backend


      - name: Build frontend image
        run: |
          docker build \
            -t cloudshop-frontend:${{ github.sha }} \
            ./frontend


  compose-validation:

    name: Docker Compose Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Create CI environment file
        run: |
          cat > .env <<EOF
          POSTGRES_DB=shopdb
          POSTGRES_USER=shopuser
          POSTGRES_PASSWORD=shoppassword
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=shopdb
          DB_USER=shopuser
          DB_PASSWORD=shoppassword
          EOF


      - name: Validate Docker Compose
        run: |
          docker compose config