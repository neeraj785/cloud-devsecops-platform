name: CloudShop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================================
  # BACKEND TEST
  # ==========================================================
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test backend health endpoint
        run: |
          cd backend
          python run.py > server.log 2>&1 &
          sleep 5
          curl --fail http://localhost:5000/api/health


  # ==========================================================
  # FRONTEND BUILD
  # ==========================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build


  # ==========================================================
  # DOCKER COMPOSE VALIDATION
  # ==========================================================
  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<EOF
          POSTGRES_DB=shopdb
          POSTGRES_USER=shopuser
          POSTGRES_PASSWORD=shoppassword
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=shopdb
          DB_USER=shopuser
          DB_PASSWORD=shoppassword
          EOF

      - name: Validate Docker Compose
        run: |
          docker compose config


  # ==========================================================
  # BUILD AND PUSH DOCKER IMAGES TO AMAZON ECR
  # ==========================================================
  build-and-publish:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build
      - compose-validation

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_REGION: ap-south-2
      BACKEND_REPOSITORY: devshop-backend 
      FRONTEND_REPOSITORY: devshop-frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (IAM User)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Builds and pushes using ONLY the simple :latest tag
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Builds and pushes using ONLY the simple :latest tag
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Display pushed images
        run: |
          echo "Production Ready Artifacts Released:"
          echo "Backend:  ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:latest"
          echo "Frontend: ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest"
