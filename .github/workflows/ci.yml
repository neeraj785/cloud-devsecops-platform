---
name: CloudShop CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test backend health endpoint
        run: |
          cd backend

          python run.py > server.log 2>&1 &

          sleep 5

          curl --fail http://localhost:5000/api/health
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build \
            -t cloudshop-backend:${{ github.sha }} \
            ./backend
      - name: Build frontend image
        run: |
          docker build \
            -t cloudshop-frontend:${{ github.sha }} \
            ./frontend
  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Create CI environment file
        run: |
          cat > .env <<EOF
          POSTGRES_DB=shopdb
          POSTGRES_USER=shopuser
          POSTGRES_PASSWORD=shoppassword
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=shopdb
          DB_USER=shopuser
          DB_PASSWORD=shoppassword
          EOF
      - name: Validate Docker Compose
        run: |
          docker compose config
  ecr-push:
    name: Push Images to Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - docker-build
      - compose-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-2
      BACKEND_REPOSITORY: cloud-devsecops-platform-backend
      FRONTEND_REPOSITORY: cloud-devsecops-platform-frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS using OIDC
      # --------------------------------------------------------
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          export OIDC_TOKEN="$TOKEN"

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("----- OIDC CLAIMS -----")
          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          print("repository:", claims.get("repository"))
          print("ref:", claims.get("ref"))
          print("repository_owner:", claims.get("repository_owner"))
          print("job_workflow_ref:", claims.get("job_workflow_ref"))
          print("environment:", claims.get("environment"))
          print("-----------------------")
          PY

          unset TOKEN
          unset OIDC_TOKEN

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::588957334666:role/cloud-devsecops-platform-github-actions
          aws-region: ap-south-2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::588957334666:role/cloud-devsecops-platform-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG \
            ./backend
      - name: Build frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG \
            ./frontend
      - name: Push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG
      - name: Push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG
      - name: Display pushed images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Backend image:"
          echo "$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

          echo "Frontend image:"
          echo "$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

